<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>卡牌组装流水线</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <b>卡牌组装流水线</b>
    <span>选模板 → 填字段 → 选素材 → AI 插画 → 批量导出</span>
  </div>
  <div class="actions">
    <button id="undoBtn" title="撤销">↶ 撤销</button>
    <button id="redoBtn" title="重做">↷ 重做</button>
    <button id="importBtn">导入数据</button>
    <input id="importFile" type="file" accept=".csv,.json,.xlsx,.xls" hidden>
    <button id="batchPdfTop" class="primary">批量 PDF</button>
  </div>
</header>

<div class="workspace">
  <aside class="left">
    <div class="panel-head">
      <div><b>卡牌集</b><small id="count"></small></div>
      <button id="newCard">＋ 新卡</button>
    </div>
    <input id="cardSearch" class="search" placeholder="搜索名称 / 模板 / 系别 / 关键词">\n    <div class="left-tools"><select id="templateFilter"><option value="all">全部模板</option></select><select id="sortCards"><option value="manual">当前顺序</option><option value="name">按名称</option><option value="cost">按费用</option><option value="faction">按系别</option><option value="rarity">按稀有度</option><option value="template">按模板</option></select></div>
    <div id="cardList" class="card-list"></div>
    <div class="row">
      <button id="duplicate">复制</button>
      <button id="delete">删除</button>
    </div>

    <div class="side-section">
      <div class="panel-head compact">
        <div><b>版本快照</b><small>本机保存</small></div>
        <button id="saveSnapshot">保存</button>
      </div>
      <div id="snapshotList" class="snapshot-list"></div>
    </div>
  </aside>

  <main class="stage">
    <div class="stagebar">
      <span>模板：<b id="templateName">标准单位卡</b> · 布局锁定</span>
      <span id="status" class="status">就绪</span>
    </div>
    <div class="checker"><div id="preview"></div></div>
    <p class="hint">卡面文字可直接点击修改；结构、对齐与安全区由系统锁定。</p>
    <div class="export-actions">
      <button id="png">PNG 300dpi</button>
      <button id="jpg">JPG 300dpi</button>
      <button id="singlePdf">单张 PDF</button>
      <button id="batchPdf" class="primary">A4 拼版 PDF</button>
    </div>
  </main>

  <aside class="right">
    <section>
      <h3>1. 模板</h3>
      <div id="templateCards" class="template-cards"></div>\n      <div class="row mini-gap"><button id="cloneTemplate">另存为自定义模板</button><button id="deleteTemplate">删除自定义模板</button></div>
    </section>

    <section>
      <h3>2. 填写卡牌</h3>
      <div class="grid">
        <label>名称<input data-form="name"></label>
        <label>费用<input type="number" data-form="cost"></label>
        <label>系别<input data-form="faction"></label>
        <label id="typeLabel">兵种<input data-form="unitType"></label>
        <label>稀有度<input data-form="rarity"></label>
      </div>
      <div id="dynamicStats" class="grid"></div>
      <label>卡牌效果<textarea id="description" rows="5"></textarea></label>
      <div id="variables" class="variables"></div>
      <label>检索关键词<input data-form="tags" placeholder="快速,远程,守备"></label>
    </section>

    <section>
      <h3>3. 插画</h3>
      <div class="row">
        <button id="uploadArt">上传图片</button>
        <button id="clearArt">清空</button>
        <input id="artFile" type="file" accept="image/*" hidden>
      </div>
      <label>AI 关键词<textarea id="aiPrompt" rows="3">战场中的主体，动态构图，环境叙事丰富</textarea></label>
      <label>整套统一风格<textarea id="aiStyle" rows="3">统一的东方奇幻桌游插画，厚涂，电影光影，材质细腻，不出现文字</textarea></label>
      <button id="aiGenerate" class="wide primary">AI 生成并自动适配</button>\n      <div class="row mini-gap"><button id="batchImages">批量导入图片</button><button id="batchAI">缺图卡牌批量 AI</button></div>\n      <input id="batchImageFiles" type="file" accept="image/*" multiple hidden>
    </section>

    <section>
      <h3>4. 素材库</h3>
      <div class="tool-row">
        <input id="assetSearch" class="search" placeholder="搜索边框 / 底纹 / 标记 / 字体">
        <select id="assetCategory">
          <option value="all">全部分类</option>
          <option value="frame">边框</option>
          <option value="texture">底纹</option>
          <option value="cost">费用标记</option>
          <option value="rarity">稀有度标记</option>
          <option value="font">字体样式</option>\n          <option value="custom">自定义图片素材</option>
        </select>
      </div>
      <div id="assetList" class="asset-list"></div>\n      <div class="upload-asset-box"><select id="uploadAssetCategory"><option value="icon">卡面图标</option><option value="frameImage">图片边框</option><option value="textureImage">图片底纹</option></select><button id="uploadAssetBtn">上传自定义素材</button><input id="customAssetFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden></div>\n      <div id="customAssetList" class="custom-assets"></div>
    </section>

    <section>
      <h3>5. 皮肤</h3>
      <input id="skinSearch" class="search" placeholder="搜索皮肤">
      <div id="skinList" class="skin-list"></div>
      <div class="colors">
        <label>主色<input type="color" data-color="primary"></label>
        <label>辅色<input type="color" data-color="secondary"></label>
        <label>强调<input type="color" data-color="accent"></label>
        <label>边框<input type="color" data-color="frame"></label>
      </div>
      <div class="stack-actions">
        <button id="saveSkin">保存当前皮肤</button>
        <button id="applyAll" class="primary">一键应用到全部卡牌</button>
      </div>
    </section>
  </aside>
</div>

<div class="hidden-export"><div id="exportCard"></div></div>
<script src="/app.js"></script>
</body>
</html>
