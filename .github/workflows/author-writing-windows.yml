name: Author writing Windows launcher and package
on:
  push:
    branches: [main]
    paths:
      - 'writing-assistant/**'
      - '.github/workflows/author-writing-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: author-writing-windows-main
  cancel-in-progress: false
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: writing-assistant
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: writing-assistant/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify and build
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/launcher.test.mjs tests/setup.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test self-contained Windows package
        shell: powershell
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          .\scripts\package-windows.ps1 -Output "$env:RUNNER_TEMP\author-writing-$version-windows-x64.zip"
      - name: Publish verified Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag="author-writing-v$version"
          $asset="$env:RUNNER_TEMP\author-writing-$version-windows-x64.zip"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset "$asset.sha256" --clobber
          } else {
            gh release create $tag $asset "$asset.sha256" --target $env:RELEASE_SHA --title "Author writing $version - Windows full package" --notes "Includes Windows x64 Node and production dependencies. Native cmd.exe, Windows PowerShell, real local MCP, persistence, diagnostics and installed runtime tested. Desktop ChatGPT account installation and proactive GPT triggering still require verification on the author's computer."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
