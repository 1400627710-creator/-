name: Card Studio Check

on:
  push:
    paths:
      - "card-studio/**"
      - ".github/workflows/card-studio-check.yml"
  pull_request:
    paths:
      - "card-studio/**"
      - ".github/workflows/card-studio-check.yml"

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run check
