name: Card Studio Check

on:
  push:
    paths:
      - "card-studio/**"
      - ".github/workflows/card-studio-check.yml"
  pull_request:
    paths:
      - "card-studio/**"
      - ".github/workflows/card-studio-check.yml"

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run check

  windows-package:
    needs: syntax-and-smoke
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package/CardStudio -Force | Out-Null
          Copy-Item card-studio/* package/CardStudio -Recurse -Force
          Remove-Item package/CardStudio/node_modules -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item package/CardStudio/.env -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: CardStudio-Windows-2.0
          path: package/CardStudio
          if-no-files-found: error
          retention-days: 30
