name: Author writing native EXE launcher
on:
  push:
    branches: [main]
    paths:
      - 'writing-launcher/**'
      - '.github/workflows/author-writing-exe-launcher.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: author-writing-exe-launcher
  cancel-in-progress: false
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: writing-launcher
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile the executable entry
        shell: powershell
        run: .\build.ps1 -Output "$env:RUNNER_TEMP\author-writing-start-0.1.3.exe"
      - name: Download and extract the verified writing app
        shell: powershell
        run: |
          $ProgressPreference='SilentlyContinue'
          $archive="$env:RUNNER_TEMP\author-writing-0.1.2-windows-x64.zip"
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/1400627710-creator/-/releases/download/author-writing-v0.1.2/author-writing-0.1.2-windows-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a7fbcccc5fcf1e790313873d494fdaf18e04670728c962af32092b7a30c1470c') { throw 'Previously verified app SHA256 changed.' }
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP\writer-exe-delivery"
      - name: Package and extract the delivered launcher
        shell: powershell
        run: |
          $exe="$env:RUNNER_TEMP\author-writing-start-0.1.3.exe"
          $zip="$env:RUNNER_TEMP\author-writing-launcher-0.1.3.zip"
          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1],'w',zipfile.ZIP_DEFLATED); z.write(sys.argv[2],'START.exe'); z.write('README.md','README.md'); z.close()" $zip $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP\delivered-exe"
          if ((Get-FileHash "$env:RUNNER_TEMP\delivered-exe\START.exe").Hash -ne (Get-FileHash $exe).Hash) { throw 'Delivered EXE bytes changed.' }
      - name: Test the real executable and writing window
        run: |
          node native.test.mjs "$env:RUNNER_TEMP\delivered-exe\START.exe" "$env:RUNNER_TEMP\writer-exe-delivery\author-writing" "$env:RUNNER_TEMP\author-writing-0.1.2-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish only after native tests pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $exe="$env:RUNNER_TEMP\author-writing-start-0.1.3.exe"
          $zip="$env:RUNNER_TEMP\author-writing-launcher-0.1.3.zip"
          $tag='author-writing-launcher-v0.1.3'
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe "$exe.sha256" $zip --clobber
          } else {
            gh release create $tag $exe "$exe.sha256" $zip --target $env:RELEASE_SHA --title 'Author writing - executable Windows launcher 0.1.3' --notes 'A native EXE startup entry that directly invokes cmd.exe and bypasses .cmd file association. Tested on native Windows with the already verified 0.1.2 full app: genuine MCP and HTTP self-check, standalone ZIP recovery, repeat launch and persistent local HTTP service. Does not change manuscripts or system file associations. This release repairs startup only; automatic GPT integration remains incomplete.'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
